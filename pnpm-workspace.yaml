packages:
  - apps/*
  - packages/*

# drizzle-kit は Studio の実行時に drizzle-orm を読み込むが、依存関係として宣言していない。
packageExtensions:
  drizzle-kit@0.31.10:
    peerDependencies:
      drizzle-orm: "*"

catalog:
  "@cloudflare/vitest-pool-workers": ^0.22.0
  "@tanstack/react-router": ^1.170.32
  "@tanstack/router-plugin": ^1.168.35
  "@tsconfig/strictest": ^2.0.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.1
  better-sqlite3: ^13.0.3
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  effect: ~3.22.1
  elysia: ^1.4.30
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ~6.0.3
  vite: ^8.2.2
  vitest: ^4.1.11
  wrangler: ^4.127.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  workerd: true

# 公開直後のパッケージを取り込まないことで、供給網への攻撃が発覚するまでの猶予を作る。
minimumReleaseAge: 1440
