schema = "requirement-set"
domain = "sales"
domain_code = "SAL"

[[requirements]]
id = "REQ-SAL-001"
title = "注文候補を入力できる"
kind = "functional"
statement = "会計担当者は、来場者から聞いた商品と個数を注文候補として入力・修正できる。"
reason = "口頭で受けた注文を正確に記録し、確定前に来場者と照合するため。"
priority = "must"
status = "draft"
specs = ["SPEC-SAL-001", "SPEC-SYS-005"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-SAL-002"
title = "注文候補で業務状態を変更しない"
kind = "constraint"
statement = "システムは、注文候補を作成・修正しただけでは正式な注文を作成せず、在庫も変更しない。"
reason = "入力途中の内容で調理や在庫更新が始まることを防ぐため。"
priority = "must"
status = "draft"
specs = ["SPEC-SAL-002"]
depends_on = ["REQ-SAL-001"]
sources = []

[[requirements]]
id = "REQ-SAL-003"
title = "合計金額を確認できる"
kind = "functional"
statement = "会計担当者は、注文候補の商品、価格、個数に基づく小計と合計金額を確認できる。"
reason = "手計算による会計ミスを減らすため。"
priority = "must"
status = "draft"
specs = ["SPEC-SAL-003"]
depends_on = ["REQ-SAL-001"]
sources = []

[[requirements]]
id = "REQ-SAL-004"
title = "お釣りを確認できる"
kind = "functional"
statement = "会計担当者は、受取金額を入力してお釣りを確認できる。"
reason = "現金会計の計算ミスを減らすため。"
priority = "must"
status = "draft"
specs = ["SPEC-SAL-004"]
depends_on = ["REQ-SAL-003"]
sources = []

[[requirements]]
id = "REQ-SAL-005"
title = "販売可能な注文を一度だけ確定できる"
kind = "functional"
statement = "会計担当者は、内容と在庫を確認した販売可能な注文を一度だけ確定できる。"
reason = "正式な注文、在庫、調理対象を一致させ、重複注文を防ぐため。"
priority = "must"
status = "draft"
specs = ["SPEC-SAL-005", "SPEC-INV-002", "SPEC-INV-003", "SPEC-KIT-001", "SPEC-SYS-005"]
depends_on = ["REQ-SAL-001", "REQ-INV-002", "REQ-INV-003"]
sources = ["DEC-SAL-001"]

[[requirements]]
id = "REQ-SAL-006"
title = "確定した注文を取り消せる"
kind = "functional"
statement = "Staff以上のロールを持つ担当者は、未受け渡しで完成済みの明細がない確定注文を取り消し、減算した在庫を一度だけ戻せる。"
reason = "確定後に判明した誤りを、在庫と調理対象を一致させたまま解消するため。"
priority = "must"
status = "draft"
specs = ["SPEC-SAL-006"]
depends_on = ["REQ-SAL-005", "REQ-INV-003"]
sources = ["DEC-SYS-002"]

[[requirements]]
id = "REQ-SAL-007"
title = "商品の現在価格を変更できる"
kind = "functional"
statement = "Admin以上のロールを持つ担当者は、営業中に商品の現在価格を変更し、以後に確定する注文へ適用できる。"
reason = "営業中に価格を見直しても、会計の金額と確定済み注文の記録を正しく保つため。"
priority = "should"
status = "draft"
specs = ["SPEC-SAL-007"]
depends_on = ["REQ-SAL-005"]
sources = ["DEC-SYS-002"]

[[requirements]]
id = "REQ-SAL-008"
title = "営業日ごとの売上を確認できる"
kind = "functional"
statement = "Admin以上のロールを持つ担当者は、営業日ごとの売上合計、注文件数、商品別の販売数と売上金額を確認できる。"
reason = "営業中は売れ行きを見て仕込みや追加調理を判断し、閉店後は現金とシステム上の売上を照合するため。"
priority = "should"
status = "draft"
specs = ["SPEC-SAL-008"]
depends_on = ["REQ-SAL-005", "REQ-SAL-006"]
sources = ["DEC-SYS-002"]
